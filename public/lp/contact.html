<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>お問い合わせ — Treevia</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/treevia/favicon.svg" />
  <style>
    :root{--ink:#0F3D2E;--gray:#5B6B62;--line:#E3EAE5;--green:#15A24A;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",Meiryo,sans-serif;color:var(--ink);line-height:1.9;background:#fff;-webkit-font-smoothing:antialiased;}
    .wrap{max-width:640px;margin:0 auto;padding:32px 20px 72px;}
    header a{color:var(--green);font-weight:800;font-size:18px;text-decoration:none;}
    h1{font-size:24px;font-weight:800;margin:28px 0 12px;}
    p{font-size:14px;color:#233;}
    .card{border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:16px;background:#F9FCFA;}
    .mail{font-size:16px;font-weight:700;}
    a{color:var(--green);}
    .back{display:inline-block;margin-top:28px;font-size:14px;color:var(--gray);text-decoration:none;}
  </style>
</head>
<body>
  <div class="wrap">
    <header><a href="./index.html">🌳 Treevia</a></header>
    <h1>お問い合わせ</h1>
    <p>本サービスに関するご質問・ご要望・不具合のご連絡は、下記メールアドレスまでお願いいたします。</p>
    <div class="card">
      <p>運営：URBAN LIFE COMMUNITY</p>
      <p class="mail">
        <a href="mailto:urbanlifecommunity.support@gmail.com">urbanlifecommunity.support@gmail.com</a>
      </p>
      <p style="color:var(--gray);font-size:13px;">※内容により、返信までにお時間をいただく場合があります。</p>
    </div>
    <a class="back" href="./index.html">← トップに戻る</a>
  </div>
</body>
</html>
