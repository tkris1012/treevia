version: 2

# 更新の提案は種類ごとに1本のPRへまとめる（個別に何十本も溜まらないように）。
# メジャー更新を ignore で除外しないのは、メジャーでしか直らない脆弱性
# （例: firebase-admin）の修正まで止めないため。まとめたPRで中身を把握し、
# 取り込むときは1つずつテストする。
updates:
  # フロントエンド（ルート）の依存ライブラリ
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # 当面メジャー更新を見送るもの（マイナー・パッチと安全上の修正は引き続き提案される）
    # - eslint 10: eslint-plugin-react が未対応で npm ci が失敗する
    # - tailwindcss 4: 設定方式が変わりビルドが失敗する（使用箇所が少なく急ぐ理由がない）
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
    labels:
      - "dependencies"
      - "security"

  # Cloud Functions の依存ライブラリ
  # 取り込んでも本番には反映されない。反映は functions/deploy.sh で手動デプロイする
  # （BILLING_SETUP.md）。決済に直結するので、デプロイ後は Webhook の動作を確認すること。
  - package-ecosystem: "npm"
    directory: "/functions"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
    labels:
      - "dependencies"
      - "security"

  # GitHub Actions ワークフローの依存
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    labels:
      - "dependencies"
      - "security"
